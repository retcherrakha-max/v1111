  <style>
    html, body {

    #root {

    .boot-splash {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .boot-spinner {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .boot-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      margin: -3.5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.55);
      animation: bootPulse 0.8s linear infinite;
    }

    .boot-dot:nth-child(1) { transform: rotate(0deg) translateY(-18px); animation-delay: 0s; }
    .boot-dot:nth-child(2) { transform: rotate(45deg) translateY(-18px); animation-delay: -0.1s; }
    .boot-dot:nth-child(3) { transform: rotate(90deg) translateY(-18px); animation-delay: -0.2s; }
    .boot-dot:nth-child(4) { transform: rotate(135deg) translateY(-18px); animation-delay: -0.3s; }
    .boot-dot:nth-child(5) { transform: rotate(180deg) translateY(-18px); animation-delay: -0.4s; }
    .boot-dot:nth-child(6) { transform: rotate(225deg) translateY(-18px); animation-delay: -0.5s; }
    .boot-dot:nth-child(7) { transform: rotate(270deg) translateY(-18px); animation-delay: -0.6s; }
    .boot-dot:nth-child(8) { transform: rotate(315deg) translateY(-18px); animation-delay: -0.7s; }

    @keyframes bootPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 1; }
    }
