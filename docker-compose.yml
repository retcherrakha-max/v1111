services:
  rakha-auth:
    build: .
    container_name: rakha-auth
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      APP_URL: "https://auth.rakha.app"
      PORT: "5050"
    volumes:
      - rakha_uploads:/app/uploads
      - rakha_appfiles:/app/appfiles
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  rakha_uploads:
  rakha_appfiles:
