[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rakhaauth"
version = "1.0.0"
description = "Rakha Auth Python SDK"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28.0",
  "cryptography>=41.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rakhaauth*"]
